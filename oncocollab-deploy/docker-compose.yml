# ============================================================
# docker-compose.yml — OncoCollab (distribution)
# ============================================================
# Démarrage : docker compose up -d
# Arrêt     : docker compose down
# Reset BDD  : docker compose down -v
# ============================================================

services:

  # ──────────────────────────────────────────
  # FRONTEND — React / Vite → nginx
  # http://localhost:80
  # ──────────────────────────────────────────
  frontend:
    image: ${DOCKER_REGISTRY}/oncocollab-frontend:latest
    container_name: oncocollab_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=frontend"

  # ──────────────────────────────────────────
  # BACKEND — NestJS
  # http://localhost:3002
  # ──────────────────────────────────────────
  backend:
    image: ${DOCKER_REGISTRY}/oncocollab-backend:latest
    container_name: oncocollab_backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - .env.backend
    environment:
      # Overrides Docker (DNS interne, pas localhost)
      POSTGRES_HOST: postgres
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/oncocollab_prerequisites}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      PIPELINE_URL: http://python-pipeline:8000
      LOCAL_REPORTS_DIR: /data/reports
      OLGA_BASE_URL: http://olga-api:9091
      ONCOVISION_BASE_URL: http://imagerie-rest:8000
      # Éditeur de workflows (Api_Editeur_Workflow/Orchestrator) — tourne nativement sur
      # l'hôte (pas dans Docker), d'où host.docker.internal plutôt qu'un alias réseau.
      WORKFLOW_ORCHESTRATOR_URL: http://host.docker.internal:9092
      SPEECHCORE_API_URL: http://api-websocket:8000
      SPEECHCORE_COMPLETION_URL: http://api-completion:8001
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: mistral:7b-q4
    volumes:
      - pipeline_reports:/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
      python-pipeline:
        condition: service_started
      ollama:
        condition: service_healthy
      api-websocket:
        condition: service_started
    networks:
      - oncocollab
      - olga
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/video/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "com.oncocollab.service=backend"

  # ──────────────────────────────────────────
  # BASE DE DONNÉES — PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oncocollab_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - .env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - oncocollab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncocollab} -d ${POSTGRES_DB:-oncocollab}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "com.oncocollab.service=postgres"

  # ──────────────────────────────────────────
  # BASE DE DONNÉES — MongoDB
  # ──────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: oncocollab_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - .env.mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - oncocollab
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "com.oncocollab.service=mongo"

  # ──────────────────────────────────────────
  # QDRANT — Base vectorielle (recherche sémantique des rapports)
  # http://localhost:6333 (REST) / 6334 (gRPC)
  # ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: oncocollab_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=qdrant"

  # ──────────────────────────────────────────
  # PYTHON PIPELINE — Whisper + Gemini + ReportLab (FastAPI)
  # http://localhost:8003 (mappé sur 8000 du container)
  # ──────────────────────────────────────────
  python-pipeline:
    image: ${DOCKER_REGISTRY}/oncocollab-python-pipeline:latest
    container_name: oncocollab_python_pipeline
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ORGANIZATION_NAME: OncoCollab
      OUTPUT_DIR: /data/reports
    volumes:
      - pipeline_reports:/data/reports
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=python-pipeline"

  # ══════════════════════════════════════════════════════════
  # SPEECHCORE SERVICES
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────────
  # OLLAMA — LLM Backend (Mistral pour SpeechCore)
  # http://localhost:11434
  # ⚠️ LIMITÉ À 4GB RAM pour ne pas crasher le PC
  # ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: oncocollab_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - oncocollab
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "com.oncocollab.service=ollama"

  # ──────────────────────────────────────────
  # OLLAMA-INIT — Pull Mistral au premier lancement
  # ⚠️ Utilise mistral:7b-q4 (quantisé 4-bit = léger)
  # ──────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: oncocollab_ollama_init
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: sh -c "ollama pull mistral:7b-q4 && exit 0"
    restart: "no"
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=ollama-init"

  # ──────────────────────────────────────────
  # API WebSocket Transcription (SpeechCore)
  # http://localhost:8000/ws/transcribe (WebSocket)
  # http://localhost:8000/extract (formulaires)
  # ──────────────────────────────────────────
  api-websocket:
    image: ${DOCKER_REGISTRY}/oncocollab-api-websocket:latest
    container_name: oncocollab_api_websocket
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - vosk_models_grand:/app/vosk-model-fr-0.22
      - vosk_models_small:/app/vosk-model-small-fr-0.22
    environment:
      GLADIA_API_KEY: ${GLADIA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: mistral:7b-q4
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - oncocollab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "com.oncocollab.service=api-websocket"

  # ──────────────────────────────────────────
  # API Complétion Formulaire (SpeechCore)
  # http://localhost:8001/extract
  # ──────────────────────────────────────────
  api-completion:
    image: ${DOCKER_REGISTRY}/oncocollab-api-completion:latest
    container_name: oncocollab_api_completion
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: mistral:7b-q4
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=api-completion"

  # ══════════════════════════════════════════════════════════
  # OLGA SERVICES
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────────
  # OLGA DESIGNER — Interface designer
  # http://localhost:8082
  # ──────────────────────────────────────────
  olga-designer:
    image: ${DOCKER_REGISTRY}/oncocollab-olga-designer:latest
    platform: linux/amd64
    container_name: oncocollab_olga_designer
    restart: unless-stopped
    ports:
      - "8082:80"
    env_file:
      - ./olga-designer/.env.front
    volumes:
      - ./olga-designer/config/config.json:/usr/share/nginx/html/config/config.json:ro
    depends_on:
      olga-api:
        condition: service_healthy
    networks:
      - oncocollab
      - olga
    labels:
      - "com.oncocollab.service=olga-designer"

  # ──────────────────────────────────────────
  # OLGA ADMIN — Interface admin
  # http://localhost:8083
  # ──────────────────────────────────────────
  olga-admin:
    image: ${DOCKER_REGISTRY}/oncocollab-olga-admin:latest
    platform: linux/amd64
    container_name: oncocollab_olga_admin
    restart: unless-stopped
    ports:
      - "8083:80"
    env_file:
      - ./olga-designer/.env.front
    volumes:
      - ./olga-designer/config/config.json:/usr/share/nginx/html/config/config.json:ro
    depends_on:
      olga-api:
        condition: service_healthy
    networks:
      - oncocollab
      - olga
    labels:
      - "com.oncocollab.service=olga-admin"

  # ──────────────────────────────────────────
  # OLGA API — Backend Olga (image externe)
  # http://localhost:9091
  # ──────────────────────────────────────────
  olga-api:
    image: kirito140/olga-backend:latest
    platform: linux/amd64
    container_name: oncocollab_olga_api
    restart: on-failure
    ports:
      - "9091:9091"
    env_file:
      - ./olga-designer/.env.back
    depends_on:
      olga-mysql:
        condition: service_healthy
    volumes:
      - ./olga-designer/config/apiKey.json:/app/config/apiKey.json:ro
    networks:
      - olga
    healthcheck:
      test: ["CMD-SHELL", "curl -s --max-time 3 http://localhost:9091/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "com.oncocollab.service=olga-api"

  # ──────────────────────────────────────────
  # OLGA MySQL — Base de données Olga
  # Port 3307 hôte → évite conflit avec un MySQL local
  # ──────────────────────────────────────────
  olga-mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: oncocollab_olga_mysql
    restart: always
    ports:
      - "3307:3306"
    env_file:
      - ./olga-designer/.env.mysql
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql/olga:/docker-entrypoint-initdb.d:ro
    networks:
      olga:
        aliases:
          - mysql  # alias pour compatibilite avec env.back (jdbc:mysql://mysql:3306)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "com.oncocollab.service=olga-mysql"

  # ══════════════════════════════════════════════════════════
  # IMAGERIE — OncoVision (visualisation/annotation d'imagerie médicale)
  # ══════════════════════════════════════════════════════════

  # ──────────────────────────────────────────
  # IMAGERIE MySQL — Métadonnées des images (OncoVision)
  # ──────────────────────────────────────────
  imagerie-mysql:
    image: mysql:8.0
    container_name: oncocollab_imagerie_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${IMAGERIE_SQL_ROOT_PASSWORD:-imagerie_root_password}
      MYSQL_DATABASE: ${IMAGERIE_SQL_DATABASE:-imagerie}
      MYSQL_USER: ${IMAGERIE_SQL_USER:-imagerie}
      MYSQL_PASSWORD: ${IMAGERIE_SQL_PASSWORD:-imagerie_password}
    volumes:
      - imagerie_mysql_data:/var/lib/mysql
      - ./data/mysql/imagerie:/docker-entrypoint-initdb.d:ro
    networks:
      - oncocollab
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "com.oncocollab.service=imagerie-mysql"

  # ──────────────────────────────────────────
  # IMAGERIE MongoDB — Rooms d'annotation collaborative (OncoVision)
  # ──────────────────────────────────────────
  imagerie-mongo:
    image: mongo:7-jammy
    container_name: oncocollab_imagerie_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${IMAGERIE_MONGO_USER:-imagerie}
      MONGO_INITDB_ROOT_PASSWORD: ${IMAGERIE_MONGO_PASSWORD:-imagerie_password}
      MONGO_INITDB_DATABASE: ${IMAGERIE_MONGO_DATABASE:-imagerie}
    volumes:
      - imagerie_mongo_data:/data/db
    networks:
      - oncocollab
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "com.oncocollab.service=imagerie-mongo"

  # ──────────────────────────────────────────
  # IMAGERIE MinIO — Stockage objet des images (OncoVision)
  # Console : http://localhost:9001
  # ──────────────────────────────────────────
  imagerie-minio:
    image: minio/minio
    container_name: oncocollab_imagerie_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${IMAGERIE_S3_USER:-imagerie}
      MINIO_ROOT_PASSWORD: ${IMAGERIE_S3_PASSWORD:-imagerie_password}
    command: server /data --console-address ":9001"
    volumes:
      - imagerie_minio_data:/data
    networks:
      - oncocollab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - "com.oncocollab.service=imagerie-minio"

  # ──────────────────────────────────────────
  # IMAGERIE REST — API FastAPI (OncoVision)
  # http://localhost:8010
  # ──────────────────────────────────────────
  imagerie-rest:
    image: ${DOCKER_REGISTRY}/oncocollab-imagerie-rest:latest
    container_name: oncocollab_imagerie_rest
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      ENVIRONMENT: ${IMAGERIE_ENVIRONMENT:-dev}
      PORT: "8000"
      SECRET: ${IMAGERIE_SECRET:-imagerie_secret}
      SQL_HOST: imagerie-mysql
      SQL_PORT: "3306"
      SQL_USER: ${IMAGERIE_SQL_USER:-imagerie}
      SQL_PASSWORD: ${IMAGERIE_SQL_PASSWORD:-imagerie_password}
      SQL_DATABASE: ${IMAGERIE_SQL_DATABASE:-imagerie}
      MONGO_HOST: imagerie-mongo
      MONGO_PORT: "27017"
      MONGO_USER: ${IMAGERIE_MONGO_USER:-imagerie}
      MONGO_PASSWORD: ${IMAGERIE_MONGO_PASSWORD:-imagerie_password}
      MONGO_DATABASE: ${IMAGERIE_MONGO_DATABASE:-imagerie}
      S3_HOST: http://imagerie-minio
      S3_PORT: "9000"
      S3_USER: ${IMAGERIE_S3_USER:-imagerie}
      S3_PASSWORD: ${IMAGERIE_S3_PASSWORD:-imagerie_password}
      S3_REGION: ${IMAGERIE_S3_REGION:-eu-west-1}
    depends_on:
      imagerie-mysql:
        condition: service_healthy
      imagerie-mongo:
        condition: service_healthy
      imagerie-minio:
        condition: service_healthy
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=imagerie-rest"

  # ──────────────────────────────────────────
  # IMAGERIE APP — SPA OncoVision (visualisation/annotation)
  # http://localhost:5174 — embarquée en iframe dans OncoCollab
  # ──────────────────────────────────────────
  imagerie-app:
    image: ${DOCKER_REGISTRY}/oncocollab-imagerie-app:latest
    container_name: oncocollab_imagerie_app
    restart: unless-stopped
    ports:
      - "5174:5173"
    environment:
      API_URL: ${IMAGERIE_API_URL:-http://localhost:8010}
    depends_on:
      - imagerie-rest
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=imagerie-app"

  # ──────────────────────────────────────────
  # TURN SERVER — Coturn (WebRTC)
  # udp/tcp 3478 + udp 50000-50100 (relais TURN)
  # ──────────────────────────────────────────
  coturn:
    image: coturn/coturn
    container_name: oncocollab_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    env_file:
      - .env
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP:-127.0.0.1}
    command:
      - -n
      - --log-file=stdout
      - --min-port=50000
      - --max-port=50100
      - --listening-ip=0.0.0.0
      - --external-ip=${EXTERNAL_IP:-127.0.0.1}
      - --realm=oncocollab
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --lt-cred-mech
    networks:
      - oncocollab
    labels:
      - "com.oncocollab.service=coturn"

# ============================================================
# VOLUMES persistants
# ============================================================
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  mysql_data:
    driver: local
  qdrant_data:
    driver: local
  pipeline_reports:
    driver: local
  ollama_data:
    driver: local
  vosk_models_grand:
    driver: local
  vosk_models_small:
    driver: local
  imagerie_mysql_data:
    driver: local
  imagerie_mongo_data:
    driver: local
  imagerie_minio_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  oncocollab:
    driver: bridge
    name: oncocollab_network
  olga:
    driver: bridge
    name: olga_network
